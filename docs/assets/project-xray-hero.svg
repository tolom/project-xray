<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Project X-Ray launch-readiness report preview</title>
  <desc id="desc">A dark dashboard-style preview showing a Project X-Ray health score, top risks, risk zones, and agent repair prompts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#15111F"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141B2B"/>
      <stop offset="1" stop-color="#0D111C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#73E0FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="35" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="240" fill="#A78BFA" opacity="0.12"/>
  <circle cx="170" cy="590" r="260" fill="#22D3EE" opacity="0.10"/>
  <path d="M80 126 C245 40, 361 190, 520 112 C704 22, 832 80, 1090 34" stroke="url(#accent)" stroke-width="2" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="96" y="80" width="1008" height="460" rx="28" fill="url(#card)" stroke="#293247"/>
    <rect x="96" y="80" width="1008" height="64" rx="28" fill="#0B1020"/>
    <circle cx="134" cy="112" r="7" fill="#EF4444"/>
    <circle cx="158" cy="112" r="7" fill="#F59E0B"/>
    <circle cx="182" cy="112" r="7" fill="#22C55E"/>
    <text x="224" y="119" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Project X-Ray · Launch-readiness scan</text>

    <text x="136" y="196" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">AI-built app risk report</text>
    <text x="136" y="228" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Find fragile zones before real users depend on them.</text>

    <rect x="136" y="270" width="260" height="184" rx="22" fill="#101827" stroke="#293247"/>
    <text x="160" y="309" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">HEALTH SCORE</text>
    <text x="160" y="368" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="900">58</text>
    <text x="252" y="365" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">/100</text>
    <rect x="160" y="396" width="112" height="34" rx="17" fill="#7F1D1D" stroke="#EF4444" opacity="0.95"/>
    <text x="178" y="418" fill="#FEE2E2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">HIGH RISK</text>

    <rect x="428" y="270" width="316" height="184" rx="22" fill="#101827" stroke="#293247"/>
    <text x="452" y="309" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">TOP RISKS</text>
    <circle cx="460" cy="342" r="5" fill="#F97316"/><text x="476" y="348" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Payment webhook verification</text>
    <circle cx="460" cy="378" r="5" fill="#F97316"/><text x="476" y="384" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Client-side role mutation</text>
    <circle cx="460" cy="414" r="5" fill="#F97316"/><text x="476" y="420" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Large dashboard orchestrator</text>

    <rect x="776" y="270" width="288" height="184" rx="22" fill="#101827" stroke="#293247"/>
    <text x="800" y="309" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">AGENT REPAIR PROMPT</text>
    <text x="800" y="344" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Fix one risk at a time.</text>
    <text x="800" y="374" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Review stripe/webhook route.</text>
    <text x="800" y="398" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Keep the change narrow.</text>
    <text x="800" y="422" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Run lint + build.</text>

    <rect x="136" y="486" width="928" height="26" rx="13" fill="#0B1020" stroke="#293247"/>
    <rect x="136" y="486" width="538" height="26" rx="13" fill="url(#accent)" opacity="0.82"/>
    <text x="136" y="555" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Repo → Scan → Evidence → Repair plan → Agent prompt → Re-scan</text>
  </g>
</svg>
